<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SARCE — Iniciar sesión</title>
<link rel="icon" href="assets/img/logo-sarce.png">

<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<!-- Tipografías institucionales -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

<!-- Hoja de estilos propia (separada de Bootstrap) -->
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<div class="login-pantalla">

  <!-- Panel de marca -->
  <aside class="login-panel-marca">
    <span class="franja-dorada"></span>

    <div class="brand-lockup">
      <div class="brand-crest-wrap">
        <img src="assets/img/logo-sarce.png" alt="Logo SARCE" class="logo-sarce-grande">
      </div>

      <div class="brand-wordmark" aria-label="SARCE CECMA">
        <div class="brand-sarce">SARCE</div>
        <div class="brand-cecma">CECMA</div>
      </div>
    </div>
  </aside>

  <!-- Panel del formulario -->
  <main class="login-panel-form">
    <div class="login-caja">

      <img src="assets/img/logo-sarce.png" alt="Logo SARCE" class="logo-sarce-movil">

      <h1 class="h4 mb-1">Bienvenido de nuevo</h1>
      <p class="text-muted-sarce mb-4">Selecciona tu perfil e inicia sesión para continuar.</p>

      <div class="selector-rol" role="tablist" aria-label="Selección de perfil">
        <button type="button" class="btn-rol activo" data-rol="estudiante">
          <i class="bi bi-mortarboard"></i> Estudiante
        </button>
        <button type="button" class="btn-rol" data-rol="docente">
          <i class="bi bi-person-workspace"></i> Docente
        </button>
      </div>

      <form id="formLogin" novalidate>
        <input type="hidden" id="rolSeleccionado" value="estudiante">

        <div class="mb-3">
          <label for="usuario" class="form-label">Usuario o carné</label>
          <div class="input-group">
            <span class="input-group-text bg-white"><i class="bi bi-person text-azul"></i></span>
            <input type="text" class="form-control" id="usuario" placeholder="Ej. 2026-0142" required>
          </div>
        </div>

        <div class="mb-3">
          <label for="contrasena" class="form-label">Contraseña</label>
          <div class="input-group">
            <span class="input-group-text bg-white"><i class="bi bi-lock text-azul"></i></span>
            <input type="password" class="form-control" id="contrasena" placeholder="••••••••" required>
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="recordarme">
            <label class="form-check-label small text-muted-sarce" for="recordarme">Recordarme</label>
          </div>
          <a href="#" class="small text-azul">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="btn btn-sarce w-100 py-2">
          Iniciar sesión <i class="bi bi-arrow-right ms-1"></i>
        </button>
      </form>

      <p class="text-center small text-muted-sarce mt-4 mb-0">
        ¿Problemas para ingresar? Contacta a secretaría académica.
      </p>
    </div>
  </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/sarce.js"></script>
</body>
</html>
